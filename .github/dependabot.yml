# Version updates, weekly (the owner's choice 2026-11-01: weekly on the public
# repositories). The workflows pin every action by commit with a `# vX.Y.Z`
# comment, and the Dockerfile pins node:22-alpine by index digest with its tag;
# without these entries those pins would never move. One pull request per
# ecosystem a week: every action in one group, npm's minor and patch updates
# in one group (a major comes alone), the image in one group. The docs check
# lets a Dependabot commit that touches only these files through (the kit's
# exemption, scripts/kit/check-docs.mjs). README "Verification".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      images:
        patterns: ["*"]
