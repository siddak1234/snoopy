name: CI

# Every pull request, and main only through main.yml, which calls this whole
# workflow when a push to main is not the tree its pull request's all-green
# already proved (register F92), and through nightly.yml, which calls it on
# main's tip each night. The jobs read nothing event-specific, so they run the
# same under any trigger, but for the gates job's DOCS_BASE: the pull request's
# base branch, and main when called, where the docs check's range is then
# empty. The schedule is nightly.yml's, never this file's (README "Nightly"
# says why).
on:
  pull_request:
  workflow_call:

# Read-only, whoever triggers or calls this workflow: no job here writes.
permissions:
  contents: read

# Each job's timeout-minutes is about twice its longest of ten green pull
# request runs (2026-10-24 to 11-01; a fixture leg 13 minutes, the scan 4, the
# browser job 3, the rest 2 or less), and never under 5: a hung job fails in
# minutes, not after GitHub's default of 360.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  gates:
    name: Architecture gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The docs check reads the pull request's commits since its base
      # (README "Verification"); on main, called by main.yml, the range is empty.
      DOCS_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The document check believes a struck path only when a commit once
        # added it, and the docs check reads every commit since the base; a
        # one-commit clone has no history to show.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when a changed area's doc did not change with it, a fact is
      # restated outside its home, or a changed doc names a missing file
      # (docs/docs-map.json).
      - run: npm run check:docs
      # Fails when docs/MAP.md is not what `npm run map` builds from the tree.
      - run: npm run map -- --check
      # Fails if a browser secret, storage, manual-login, or direct-database
      # path returns.
      - run: npm run audit:boundaries
      # Fails when a committed lib/generated file is not what the generator
      # makes from the hash-checked copy of the backend's contract files
      # (lib/generated/snoopy-backend, its SHA256SUMS; README "Verification").
      - run: npm run verify:platform-contracts
      # Fails if the backend session wire contract drifts, and when any
      # contract test skipped or was left todo: a skip is a check that did
      # not run (README "Verification").
      - name: Contract tests, none skipped
        run: |
          set -o pipefail
          npm run test:contracts | tee "$RUNNER_TEMP/contracts.tap"
          if grep -qE '^# (skipped|todo) [1-9]' "$RUNNER_TEMP/contracts.tap"; then
            echo 'FAIL: a contract test skipped'
            exit 1
          fi
      - name: No salvaged client data
        run: |
          # `_salvage/` lives in the workspace folder, outside every repository. It
          # holds the recovered n8n workflows and the legacy database archive: real
          # customer email addresses, vendor names, and dollar amounts. This
          # repository is public and git history is permanent, so deleting such a
          # file in a later commit does not remove it — the only workable control is
          # to never let it land.
          if git ls-files | grep -i '_salvage'; then
            echo "FAIL: a _salvage path is tracked in this repository."
            exit 1
          fi
          # Excludes .github/workflows: this file necessarily names the identifiers
          # it searches for.
          if git grep -Iln -iE 'gideontoal|clarossolutions' -- . ':(exclude).github/workflows/*'; then
            echo "FAIL: a real client identifier appears in tracked content."
            exit 1
          fi
          echo "No salvaged client data: PASS"

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Required at BUILD time, not runtime: Next bakes rewrites into
      # routes-manifest.json. Without this, next.config.ts emits no
      # /api/platform rewrite and every browser API call 404s in production
      # while the build still exits 0. Asserted below.
      BACKEND_API_ORIGIN: https://backend.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert the backend gateway rewrite is present in the build output
        run: |
          node -e "
            const m = require('./.next/routes-manifest.json');
            const r = m.rewrites;
            const all = Array.isArray(r)
              ? r
              : [...(r?.beforeFiles ?? []), ...(r?.afterFiles ?? []), ...(r?.fallback ?? [])];
            const hit = all.find((x) => typeof x.source === 'string' && x.source.startsWith('/api/platform'));
            if (!hit) {
              console.error('FAIL: production build contains no /api/platform rewrite.');
              console.error('BACKEND_API_ORIGIN was missing or invalid at build time, so');
              console.error('next.config.ts emitted an empty rewrite list. Every browser');
              console.error('call to the backend gateway would 404 against this build.');
              process.exit(1);
            }
            console.log('OK: ' + hit.source + ' -> ' + hit.destination);
          "

  # A Vercel preview builds with no BACKEND_API_ORIGIN: the site with no
  # backend, whose account area sends everyone to sign in. A page that reads the
  # platform with no session fails that build while it prerenders (register
  # F62), and the build above, with the origin set, cannot see it.
  build-no-backend:
    name: Build with no backend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:no-backend
      # Served as a preview serves it (register F62's run-time path).
      - run: npm run probe:no-backend

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  browser:
    name: Browser regression and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # The image's tag is package-lock.json's @playwright/test, and both move
    # together by hand (README "Verification"); the digest is that tag's.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    # Firefox will not start as root under a HOME another user owns, and a
    # container job's HOME is /github/home, owned by the image's pwuser.
    # Chromium and WebKit do not mind, so a local `docker run` of this image
    # (HOME=/root) passed in all three engines while CI's Firefox could not launch.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BACKEND_API_ORIGIN: https://backend.invalid
      - run: npm run test:browser
      # Every collected test ran: this job collects no fixture spec
      # (playwright.config.ts), so a skip is a test that stopped running.
      - run: node scripts/no-skipped-browser-tests.mjs

  # The authenticated suite against the loopback fixture Edge (backend BUILD-PLAN
  # 22.6.6): every account page, every refusal the website must survive, in all
  # three engines (NFR-36). It had only ever run on a developer's machine.
  #
  # One leg per engine (register F90): run in series in one job, the three
  # engines were 13-14 of the run's 15-16 minutes. Each leg builds, starts its
  # own fixture Edge and standalone server, and runs one Playwright project;
  # nothing is shared between legs. `fail-fast: false`: one engine's failure
  # still lets the other two report. The job id stays `fixtures` — all-green
  # needs it, and its result is the three legs' together.
  fixtures:
    name: Authenticated fixture suite (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    # Firefox needs a HOME that root owns, as in `browser`.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds with the fixture's origin, serves the standalone bundle, and
      # runs the accessibility and fixture specs against it — in this leg's
      # engine only; the runner passes its arguments to Playwright.
      - run: npm run test:browser:fixtures -- --project=${{ matrix.project }}

  # Backend SYSTEM-MANIFEST §12.2 #8, on NFR-24's model (the backend's own
  # `ci.yml`): what ships must be clean, so the runtime tree and the image block;
  # build tooling, and vulnerabilities upstream has not fixed, are reported. A
  # gate that goes red for what nobody can act on is a gate somebody switches off.
  scan:
    name: Dependency and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build and test dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Built and never pushed: the scan proves the image is clean without
      # anywhere to leak a credential to.
      - name: Build the website image
        id: image
        if: ${{ !cancelled() }}
        run: docker build --build-arg BACKEND_API_ORIGIN=https://backend.invalid -t autom8x-web:ci .

      # trivy-action's own setup installs trivy from get.trivy.dev, which stopped
      # resolving on 2026-11-04 (NXDOMAIN; snoopy-backend §12.1 #328). The same
      # pinned release comes from GitHub instead, checked against its published
      # checksum, and every trivy step below skips its own setup.
      - name: Install trivy 0.70.0 from its GitHub release, checksum-verified
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          set -euo pipefail
          archive=trivy_0.70.0_Linux-64bit.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/$archive"
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pinned by commit, not tag: a tag is a promise its owner can rewrite, and
      # this is the security gate. The comment names the version the commit is.
      - name: Scan the image — fixable CRITICAL and HIGH block
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: autom8x-web:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Report the image, including vulnerabilities with no fix yet
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: autom8x-web:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          format: table

      # NFR-25: an SBOM of exactly the artifact that was scanned, kept with the
      # build, so "which images carry this package" has an answer the day a CVE
      # lands.
      - name: SBOM — website image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: autom8x-web:ci
          format: cyclonedx
          output: sbom-web.cdx.json

      - name: Retain the SBOM
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-web.cdx.json
          if-no-files-found: error
          retention-days: 90

  # The committed platform types against the contract the RUNNING platform
  # serves (register F94): each generated file's sha256 header must equal the
  # hash the public GET https://api.autom8x.ai/health/live reports for its
  # document (the platform's deployed marker). This repository's merge is its
  # release, so a PR generated against a platform that is not promoted is red
  # here, before it deploys. Fails closed — an unreachable host or an answer
  # with no marker is red, never a skip; platform-requirement.json is the one
  # reviewed escape for a change that must land ahead of the platform
  # (scripts/verify-deployed-contracts.mjs). Node's own fetch and no
  # dependency, so no install; no secret.
  contract-deployed:
    name: Deployed contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-deployed-contracts.mjs

  # Green only when every job above succeeded. The ruleset names four jobs; the
  # other four — the no-backend build, the browser and fixture suites, the scan —
  # gated nothing, and a merge could land while they ran or failed (register
  # F88). Once the ruleset requires this one check, sourced from GitHub Actions,
  # every job gates. It runs whatever the others did (`always()`), or a failure
  # upstream would skip it and the check would never report. Nothing here may
  # skip: a skipped job is a gate that did not run, so only "success" passes.
  all-green:
    name: all-green
    if: always()
    needs:
      - lint
      - gates
      - build
      - build-no-backend
      - typecheck
      - browser
      - fixtures
      - scan
      - contract-deployed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_green=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$not_green" ]; then
            echo "FAIL: not every job succeeded — $(echo "$not_green" | tr '\n' ' ')"
            exit 1
          fi
          echo "all-green: every job succeeded"
